<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Hub | GiftGallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f0f2f5;
        padding-top: 50px;
      }
      .hub-card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container text-center">
      <h2 class="mb-4">Welcome, {{ username }}! 👋</h2>
      <a href="/logout" class="text-danger mb-5 d-block">Logout</a>

      <div class="row justify-content-center">
        <!-- Option 1: Join Event -->
        <div class="col-md-5">
          <div class="hub-card">
            <h4>📤 Upload Photos</h4>
            <p class="text-muted">
              Have an event code? Join to upload your photos.
            </p>
            <form action="/join" method="POST">
              <input
                type="text"
                name="event_code"
                class="form-control mb-3"
                placeholder="Event Code"
                required
              />
              <button type="submit" class="btn btn-primary w-100">
                Join Event
              </button>
            </form>
          </div>
        </div>

        <!-- Option 2: View Gallery -->
        <div class="col-md-5">
          <div class="hub-card">
            <h4>🖼️ View Gallery</h4>
            <p class="text-muted">
              Enter event code to see AI-clustered photos.
            </p>
            <form action="/gallery" method="POST">
              <input
                type="text"
                name="gallery_code"
                class="form-control mb-3"
                placeholder="Event Code"
                required
              />
              <button type="submit" class="btn btn-success w-100">
                View Gallery
              </button>
            </form>
          </div>
        </div>
        <!-- Option 3: Create New Event -->
        <div class="col-md-5 mt-4">
          <div class="hub-card" style="border: 2px solid #f59e0b">
            <h4>🎉 Host an Event</h4>
            <p class="text-muted">Create a secure AI gallery for your party.</p>
            <form action="/create_event" method="POST">
              <button
                type="submit"
                class="btn btn-warning w-100 text-dark fw-bold"
              >
                Generate Event Code
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
