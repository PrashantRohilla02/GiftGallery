<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftGallery | AI Photo Clustering</title>
    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f0f2f5;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .btn-custom {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        width: 100%;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-custom:hover {
        background: #5a6fd1;
        transform: translateY(-2px);
      }
      .brand-icon {
        font-size: 3rem;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand-icon">📸</div>
      <h2 class="mb-3">GiftGallery</h2>
      <p class="text-muted mb-4">
        Enter your Event Code to join or view smart-clustered photos.
      </p>

      <form action="/join" method="POST">
        <input
          type="text"
          name="event_code"
          class="form-control form-control-lg mb-3"
          placeholder="e.g., GALAXY2026"
          required
          autocomplete="off"
        />
        <button type="submit" class="btn btn-custom">Enter Event</button>
      </form>
    </div>
  </body>
</html>
