<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftGallery | AI Photo Clustering</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f8fafc;
      }
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .landing-card {
        background: white;
        padding: 48px;
        border-radius: 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .brand-icon {
        width: 72px;
        height: 72px;
        background: var(--primary);
        color: white;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin: 0 auto 24px;
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
      }
      h2 {
        font-weight: 700;
        color: #1e293b;
      }
      .btn-custom {
        background: var(--primary);
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 12px;
        width: 100%;
        font-weight: 600;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .btn-custom:hover {
        background: #4338ca;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        color: white;
      }
      .form-control {
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
      }
      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="landing-card">
      <div class="brand-icon">
        <i class="fas fa-camera-retro"></i>
      </div>
      <h2>GiftGallery</h2>
      <p class="text-muted mb-4">
        Enter your Event Code to join or view smart-clustered photos.
      </p>

      <form action="/join" method="POST">
        <input
          type="text"
          name="event_code"
          class="form-control form-control-lg mb-3 text-center fw-bold"
          placeholder="ENTER CODE"
          required
          autocomplete="off"
          style="letter-spacing: 2px; text-transform: uppercase"
        />
        <button type="submit" class="btn btn-custom">
          <span>Enter Event</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top">
        <a href="/" class="text-decoration-none text-muted small">
          <i class="fas fa-user me-1"></i> Host Login
        </a>
      </div>
    </div>
  </body>
</html>
